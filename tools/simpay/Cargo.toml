[package]
name = "simpay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "SIMULATED payment provider for Nodkey Demo P tests. Not a real payment API."
publish = false

# Each dependency is justified in README.md ("Dependencies").
[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1"
form_urlencoded = "1"
hmac = "0.13"
sha2 = "0.11"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = false
strip = true
