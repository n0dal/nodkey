[package]
name = "simpay"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "SIMULATED payment provider for Nodkey Demo P tests. Not a real payment API."
publish = false

# Each dependency is justified in README.md ("Dependencies").
[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1"
form_urlencoded = "1"
hmac = "0.13"
sha2 = "0.11"
# TLS (no OpenSSL): rustls with the ring provider. The server enables TLS 1.3 only; the
# `tls12` feature is compiled in solely so tests can prove a TLS 1.2 client is refused.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "crypto"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = false
strip = true
