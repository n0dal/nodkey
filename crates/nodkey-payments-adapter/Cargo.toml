[package]
name = "nodkey-payments-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Nodkey payments adapter (prototype): grant-verifying refund adapter for the simpay simulator (payments-adapter-v1 Draft 3)"
publish = false

# Each dependency is justified in README.md ("Dependencies").
[dependencies]
nodkey-grant = { path = "../nodkey-grant" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1", default-features = false }
# TLS 1.3 only: the `tls12` feature is NOT enabled for the adapter build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
tokio-postgres = { version = "0.7", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1", default-features = false, features = ["std"] }
form_urlencoded = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
# Tests only: a TLS 1.2-only fake server proves the adapter's client refuses TLS 1.2 even when the
# library has TLS 1.2 compiled in. Feature unification applies to test builds only; the adapter
# binary (`cargo build`) is built without `tls12`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
strip = true
