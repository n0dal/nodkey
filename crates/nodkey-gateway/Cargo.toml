[package]
name = "nodkey-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Nodkey gateway (prototype): the only public HTTP listener; app/auth origins, sessions, confirmation pages"
publish = false

# Each dependency is justified in README.md ("Dependencies").
[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1", default-features = false }
bytes = { version = "1", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
getrandom = { version = "0.4", default-features = false }
form_urlencoded = { version = "1", default-features = false, features = ["std"] }
nodkey-grant = { path = "../nodkey-grant" }

[features]
# TEST LOGIN (R3B-11): compiles in a local login without credentials. It is also off at runtime unless
# the configuration sets `test_login.enabled = true`, and the gateway then refuses to listen on a
# non-loopback address. Never enable in a deployment.
test-login = []

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = false
strip = true
