[package]
name = "nodkey-mcp-front"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Nodkey per-agent MCP front (prototype): translates MCP tool calls to effect protocol v2 on the agent's broker socket. Outside the TCB; holds no secrets."
publish = false

# Each dependency is justified in README.md ("Dependencies").
[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "time", "sync", "signal"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
# Tests launch the stdio shim as a subprocess.
tokio = { version = "1", default-features = false, features = ["process"] }

[lib]
name = "nodkey_mcp_front"
path = "src/lib.rs"

[[bin]]
name = "nodkey-mcp"
path = "src/bin/nodkey-mcp.rs"

[[bin]]
name = "nodkey-mcp-stdio"
path = "src/bin/nodkey-mcp-stdio.rs"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = false
strip = true
