# DEV-ONLY TCP relay in the GATEWAY's network namespace (compose: network_mode service:gateway).
# The gateway refuses non-loopback listen addresses when dev TLS or the test login is on, but a
# published container port arrives on the container's eth0. This relay forwards the published
# port (bound to 127.0.0.1 on the host) to the gateway's loopback listener. TLS is end-to-end
# (the relay sees ciphertext only). See tests/demo2/FINDINGS.md (DEMO2-F01; reused in Demo P).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
stream {
    server {
        listen 8443;
        proxy_pass 127.0.0.1:8444;
        proxy_connect_timeout 5s;
    }
}
