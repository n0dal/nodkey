# Gateway for the INTENTIONALLY VULNERABLE demo (baseline profile = conventional config).
# Deliberately does NOT ignore X-Accel-* headers, to serve as the positive control for probe X-01.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 256k;

    server {
        listen 8080;
        server_name _;

        location /_internal/ {
            internal;
            default_type text/plain;
            return 200 "NODKEY-INTERNAL-CANARY\n";
        }

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
            fastcgi_pass unix:/run/fcgi/php.sock;
            fastcgi_read_timeout 120s;
        }
    }
}
