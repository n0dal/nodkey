[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; user/group only take effect if the master runs as root (not the case in either profile).
user = app
group = app
listen = /run/fcgi/php.sock
listen.mode = 0666
pm = static
pm.max_children = 3
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
; Environment is NOT cleared: the protected profile must not depend on clear_env for SI-02.
clear_env = no
access.log = /proc/self/fd/2
