# PROTECTED profile = Deployment Profile P0 (docs/research/03-runtime-isolation.md §6).
# INTENTIONALLY VULNERABLE DEMO: the app exposes an RCE endpoint. Bound to 127.0.0.1 only.
# Secrets are generated by tests/containment/run.sh into ../../var/containment/secrets/.
name: nodkey-protected

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]   # default seccomp + AppArmor apply; never "unconfined"
  ipc: private
  pids_limit: 256
  privileged: false
  logging:
    driver: json-file
    options: { max-size: "1m", max-file: "3" }

services:
  app:                         # UNTRUSTED workload (modelled as attacker-controlled)
    <<: *hardening
    image: nodkey/php-ledger-app:dev
    build: { context: ., dockerfile: docker/php/Dockerfile }
    user: "10001:10001"
    network_mode: "none"       # loopback only: no route, no DNS, no metadata, no gateway
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700"]
    volumes:
      - fcgi:/run/fcgi                  # php-fpm binds its socket here
      - nodkey-app1:/run/nodkey:ro            # broker socket for THIS workload only
    environment: {}                     # no secrets, no DB URL
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      broker: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "test", "-S", "/run/fcgi/php.sock"]
      interval: 2s
      timeout: 2s
      retries: 30

  web:                         # ingress gateway (trusted config, untrusted traffic)
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    user: "101:101"
    networks: [edge]
    ports: ["127.0.0.1:8080:8080"]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101"]
    volumes:
      - fcgi:/run/fcgi
      - ./docker/nginx/nginx.protected.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app: { condition: service_healthy }

  broker:                      # TRUSTED
    <<: *hardening
    image: nodkey/broker:dev
    build: { context: ../.., dockerfile: broker/Dockerfile }
    user: "10002:10002"
    networks:
      data: { ipv4_address: 172.30.10.10 }
    volumes:
      - nodkey-app1:/run/nodkey/app1
      - nodkey-app2:/run/nodkey/app2
      - ./docker/broker/broker.json:/etc/nodkey/broker.json:ro
    secrets:
      - source: db_broker_password
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/nodkey-broker", "--healthcheck", "/etc/nodkey/broker.json"]
      interval: 2s
      timeout: 2s
      retries: 30

  db:                          # PROTECTED RESOURCE
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    networks:
      data: { ipv4_address: 172.30.10.20 }
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "password_encryption=scram-sha-256"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
    secrets: [db_broker_password, db_superuser_password]
    volumes:
      - ./docker/postgres/pg_hba.protected.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "3" }
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ledger"]
      interval: 2s
      timeout: 2s
      retries: 30

networks:
  edge: {}
  data:
    internal: true
    ipam: { config: [{ subnet: 172.30.10.0/24 }] }

# Socket volumes are tmpfs-backed: non-persistent, noexec (AR-12). DB storage is separate.
volumes:
  fcgi:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0755" }
  nodkey-app1:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,noexec,nosuid,nodev,uid=10002,gid=10002,mode=0755" }
  nodkey-app2:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m,noexec,nosuid,nodev,uid=10002,gid=10002,mode=0755" }
  dbdata: {}

secrets:
  db_broker_password: { file: ../../var/containment/secrets/protected/db_broker_password }
  db_superuser_password: { file: ../../var/containment/secrets/protected/db_superuser_password }
