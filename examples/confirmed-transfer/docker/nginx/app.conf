# Web server of the UNTRUSTED app trust domain (INTENTIONALLY VULNERABLE demo; local use only).
# network_mode none: it listens only on a Unix socket that the gateway alone mounts, and talks
# FastCGI to php-fpm over a second Unix socket.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 256k;

    server {
        listen unix:/run/app-http/nginx.sock;
        server_name _;

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
            fastcgi_pass unix:/run/fcgi/php.sock;
            # The workload is untrusted: none of its response headers may steer nginx (AR-15).
            fastcgi_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
            fastcgi_hide_header X-Accel-Redirect;
            fastcgi_hide_header X-Accel-Expires;
            fastcgi_hide_header X-Accel-Limit-Rate;
            fastcgi_hide_header X-Accel-Buffering;
            fastcgi_hide_header X-Accel-Charset;
            fastcgi_intercept_errors off;
            fastcgi_read_timeout 120s;
        }
    }
}
