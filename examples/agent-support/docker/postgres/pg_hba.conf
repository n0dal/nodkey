# Demo A (as Demo P, payments-adapter-v1 §1, plus the SIMULATED mail sink). First match wins.
# TYPE  DATABASE  USER                       ADDRESS          METHOD
# Init scripts and operator oracles (OS user postgres inside the db container only).
local   all       postgres                                    peer
# --- exactly as payments-adapter-v1 §1, in this order ---
local   ledger    nodkey_payments_adapter                   scram-sha-256
host    all       nodkey_payments_adapter  0.0.0.0/0        reject
host    all       nodkey_payments_adapter  ::/0             reject
host    ledger    nodkey_broker            172.30.20.10/32  scram-sha-256
# --- end of the spec lines ---
# Demo A mail sink: read-only role (SELECT public.outbox only), from its own address only.
host    ledger    nodkey_mailsink          172.30.20.30/32  scram-sha-256
# Operator path (the harness seeding nodkey.orders / nodkey.customers): Unix socket inside the db container only.
local   ledger    nodkey_shop_operator                      scram-sha-256
host    all       all                        0.0.0.0/0        reject
host    all       all                        ::/0             reject
local   all       all                                         reject
