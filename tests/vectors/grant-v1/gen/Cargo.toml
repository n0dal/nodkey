[package]
name = "nodkey-grant-v1-vectors"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Generator and reference checker for the Nodkey-Grant v1 test vectors (TEST-ONLY keys)"
publish = false

[dependencies]
